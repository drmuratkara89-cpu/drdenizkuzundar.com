<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 1000" width="100%" height="100%">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#F7EFE9" />
      <stop offset="50%" stop-color="#EDE4DA" />
      <stop offset="100%" stop-color="#E2D7CC" />
    </linearGradient>
    <linearGradient id="skinGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FDECE2" />
      <stop offset="100%" stop-color="#EACBB8" />
    </linearGradient>
    <linearGradient id="hairGrad" x1="0%" y1="0%" x2="50%" y2="100%">
      <stop offset="0%" stop-color="#3D2E28" />
      <stop offset="100%" stop-color="#241B18" />
    </linearGradient>
    <linearGradient id="coatGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FFFFFF" />
      <stop offset="100%" stop-color="#EFEFEF" />
    </linearGradient>
    <linearGradient id="accentGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#C69288" />
      <stop offset="100%" stop-color="#C2A580" />
    </linearGradient>
    <filter id="softShadow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="16" stdDeviation="24" flood-color="#3A2D28" flood-opacity="0.12" />
    </filter>
  </defs>

  <!-- Background Canvas -->
  <rect width="800" height="1000" fill="url(#bgGrad)" />

  <!-- Architectural Minimalist Arches -->
  <path d="M120,1000 Q120,180 400,180 Q680,180 680,1000 Z" fill="#FDFBF9" opacity="0.65" />
  <circle cx="680" cy="220" r="140" fill="url(#accentGrad)" opacity="0.1" />

  <!-- Botanical / Organic Subtle Flourish -->
  <path d="M640,420 Q700,380 720,290 Q650,320 640,420 Z" fill="#C69288" opacity="0.25" />
  <path d="M650,440 Q740,410 760,330 Q680,360 650,440 Z" fill="#C2A580" opacity="0.2" />

  <!-- Doctor Silhouette & Presence -->
  <g filter="url(#softShadow)">
    <!-- Hair Backdrop -->
    <path d="M260,380 Q240,220 400,200 Q560,220 540,380 Q560,540 500,640 L300,640 Q240,540 260,380 Z" fill="url(#hairGrad)" />

    <!-- Shoulders & Medical Coat (Modern Minimalist Cut) -->
    <path d="M180,1000 L220,700 Q260,620 400,620 Q540,620 580,700 L620,1000 Z" fill="url(#coatGrad)" />
    <!-- Coat Lapels -->
    <path d="M330,620 L400,820 L470,620 L510,720 L400,900 L290,720 Z" fill="#F8F8F8" stroke="#E6E0D8" stroke-width="2" />
    <!-- Inner Silk Blouse (Soft Warm Rose) -->
    <polygon points="360,620 400,740 440,620 400,610" fill="#E8D3CB" />

    <!-- Neck -->
    <path d="M360,490 L360,620 Q400,635 440,620 L440,490 Z" fill="url(#skinGrad)" />

    <!-- Head & Face Contour -->
    <path d="M320,380 Q320,530 400,530 Q480,530 480,380 Q480,260 400,260 Q320,260 320,380 Z" fill="url(#skinGrad)" />

    <!-- Styled Front Hair Waves -->
    <path d="M310,340 Q380,250 440,310 Q490,360 500,420 Q480,440 460,400 Q440,350 400,340 Q360,340 330,390 Z" fill="url(#hairGrad)" />

    <!-- Calm Facial Features -->
    <!-- Eyes -->
    <path d="M350,380 Q370,373 385,382" stroke="#3A2D28" stroke-width="3.5" fill="none" stroke-linecap="round" />
    <circle cx="368" cy="384" r="5" fill="#3A2D28" />
    <path d="M415,382 Q430,373 450,380" stroke="#3A2D28" stroke-width="3.5" fill="none" stroke-linecap="round" />
    <circle cx="432" cy="384" r="5" fill="#3A2D28" />
    <!-- Eyebrows -->
    <path d="M345,365 Q368,358 388,368" stroke="#3A2D28" stroke-width="2.5" fill="none" stroke-linecap="round" />
    <path d="M412,368 Q432,358 455,365" stroke="#3A2D28" stroke-width="2.5" fill="none" stroke-linecap="round" />
    <!-- Nose Contour -->
    <path d="M398,382 L394,420 Q400,425 406,420" stroke="#CBA492" stroke-width="2" fill="none" stroke-linecap="round" />
    <!-- Natural Calm Smile -->
    <path d="M375,455 Q400,475 425,455" stroke="#B87B70" stroke-width="3" fill="none" stroke-linecap="round" />
    <path d="M378,455 Q400,463 422,455" stroke="#DCAAA0" stroke-width="1.5" fill="none" />
  </g>

  <!-- Elegant Framing & Name Watermark -->
  <rect x="40" y="40" width="720" height="920" rx="32" fill="none" stroke="#D8C9BC" stroke-width="1.5" stroke-dasharray="8 6" opacity="0.6" />
  <text x="400" y="930" font-family="'Cormorant Garamond', Georgia, serif" font-size="28" font-weight="600" fill="#2D2826" text-anchor="middle" letter-spacing="3">DR. DENİZ KUZUNDAR</text>
  <text x="400" y="955" font-family="'Plus Jakarta Sans', sans-serif" font-size="13" font-weight="500" fill="#8C776E" text-anchor="middle" letter-spacing="4">KADIN SAĞLIĞI &amp; ESTETİĞİ</text>
</svg>
