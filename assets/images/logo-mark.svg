<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 160 160" width="100%" height="100%" fill="none">
  <defs>
    <!-- Warm Rose Gold & Antique Bronze Gradients -->
    <linearGradient id="markGold" x1="10%" y1="10%" x2="90%" y2="90%">
      <stop offset="0%" stop-color="#E2BBB1" />
      <stop offset="35%" stop-color="#C69288" />
      <stop offset="70%" stop-color="#9C6B61" />
      <stop offset="100%" stop-color="#734942" />
    </linearGradient>

    <linearGradient id="markGoldLight" x1="0%" y1="100%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#8C655E" />
      <stop offset="50%" stop-color="#DFB8AE" />
      <stop offset="100%" stop-color="#FBF4EF" />
    </linearGradient>

    <linearGradient id="markBg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FCFAF7" />
      <stop offset="60%" stop-color="#FAF5EE" />
      <stop offset="100%" stop-color="#F1E5D8" />
    </linearGradient>

    <filter id="markShadow" x="-20%" y="-20%" width="140%" height="140%" filterUnits="userSpaceOnUse">
      <feDropShadow dx="0" dy="1.5" stdDeviation="2" flood-color="#734942" flood-opacity="0.18" />
    </filter>
  </defs>

  <!-- Outer Double Luxury Ring -->
  <circle cx="80" cy="80" r="74" fill="url(#markBg)" stroke="url(#markGold)" stroke-width="1.8" />
  <circle cx="80" cy="80" r="68" stroke="url(#markGold)" stroke-width="0.7" stroke-dasharray="2 2.5" opacity="0.65" />

  <!-- Botanical Longevity Crescents -->
  <path d="M 32,80 C 32,52 54,30 80,30" stroke="url(#markGold)" stroke-width="0.9" stroke-linecap="round" opacity="0.45" />
  <path d="M 128,80 C 128,108 106,130 80,130" stroke="url(#markGold)" stroke-width="0.9" stroke-linecap="round" opacity="0.45" />

  <!-- Zenith Star (Guidance, Longevity, Excellence) -->
  <g transform="translate(80, 21)" filter="url(#markShadow)">
    <path d="M 0,-6.5 L 1.6,-1.6 L 6.5,0 L 1.6,1.6 L 0,6.5 L -1.6,1.6 L -6.5,0 L -1.6,-1.6 Z" fill="url(#markGold)" />
    <circle cx="0" cy="0" r="0.9" fill="#FFFFFF" />
  </g>

  <!-- Nadir Seed Pearl -->
  <circle cx="80" cy="139" r="1.8" fill="url(#markGold)" />

  <!-- Intertwined Monogram: D and K -->
  <g filter="url(#markShadow)">
    <!-- === LETTER 'D' === -->
    <!-- D Left Serif Stem -->
    <path d="M 44,46 L 56,46 M 50,46 L 50,114 M 44,114 L 56,114" 
          stroke="url(#markGold)" stroke-width="2.6" stroke-linecap="square" />
    
    <!-- D Curved Arch -->
    <path d="M 50,47 C 78,47 98,59 98,80 C 98,101 78,113 50,113" 
          fill="none" stroke="url(#markGold)" stroke-width="2.6" stroke-linecap="round" />

    <!-- === LETTER 'K' === -->
    <!-- K Vertical Stem (Interwoven with D) -->
    <path d="M 70,46 L 82,46 M 76,46 L 76,114 M 70,114 L 82,114" 
          stroke="url(#markGoldLight)" stroke-width="2.2" stroke-linecap="square" opacity="0.95" />

    <!-- K Upper Ascending Arm -->
    <path d="M 76,77 L 105,47" 
          stroke="url(#markGold)" stroke-width="2.5" stroke-linecap="round" />
    <path d="M 100,45 L 108,45" 
          stroke="url(#markGold)" stroke-width="1.8" stroke-linecap="round" />

    <!-- K Lower Descending Leg -->
    <path d="M 79,74 L 107,113" 
          stroke="url(#markGold)" stroke-width="2.6" stroke-linecap="round" />
    <path d="M 101,114 L 113,114" 
          stroke="url(#markGold)" stroke-width="2" stroke-linecap="round" />
  </g>
</svg>
