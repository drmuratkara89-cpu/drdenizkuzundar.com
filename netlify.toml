[build]
  publish = "."

[build.processing]
  skip_processing = false

[build.processing.html]
  pretty_urls = true

[[redirects]]
  from = "https://www.drdenizkuzundar.com/*"
  to = "https://drdenizkuzundar.com/:splat"
  status = 301
  force = true

[[redirects]]
  from = "http://www.drdenizkuzundar.com/*"
  to = "https://drdenizkuzundar.com/:splat"
  status = 301
  force = true

[[redirects]]
  from = "http://drdenizkuzundar.com/*"
  to = "https://drdenizkuzundar.com/:splat"
  status = 301
  force = true

[[headers]]
  for = "/*"
  [headers.values]
    Strict-Transport-Security = "max-age=31536000; includeSubDomains; preload"
    X-Content-Type-Options = "nosniff"
    X-Frame-Options = "SAMEORIGIN"
    Referrer-Policy = "strict-origin-when-cross-origin"
    Permissions-Policy = "camera=(), microphone=(), geolocation=()"
